<!DOCTYPE html> 
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>CashHive System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/cadastrar_despesas_produtos.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../css/modalsair.css">
</head>
<body>

<header class="container-header">
    <div class="logo">
        <img src="/img/logo.png" alt="Logo CashHive">
    </div>
    <div class="user">
        <p>Usuário Fulano de Tal (00.623.904/0001-73)</p>
    </div>
</header>

<div class="main-container">
    <aside class="menu">
        <nav class="nav">
            <ul>
                <li>
                    <img src="/img/homeicon.svg" alt="Início">
                    <a href="homepage.html">Página inicial</a>
                </li>
                <li>
                    <img src="/img/profileicon.svg" alt="Perfil">
                    <a href="profle.html">Perfil</a>
                </li>
                <li>
                    <details class="submenu">
                        <summary>
                            <img src="/img/financeicon.svg" alt="Financeiro">
                            Financeiro
                        </summary>
                        <ul>
                            <li><a href="receitas_kibon.html">Receitas</a></li>
                            <li><a href="cadastrar_receitas.html">Cadastro de Receitas</a></li>
                            <li><a href="#">Despesas</a></li>
                            <li><a href="cadastrar_despesas_funcionario.html">Cadastro de Despesas</a></li>
                        </ul>
                    </details>
                </li>
                <li class="logout">
                    <img src="/img/logouticon.svg" alt="Sair">
                    <button class="open-modal" data-modal="modal-sair">Sair</button>
                </li>
            </ul>
        </nav>
    </aside>

    <div class="nav-category">
        <nav class="nav-options">
            <ul>
                <li><a href="cadastrar_despesas_funcionario.html">Funcionário</a></li>
                <li class="active"><a href="cadastrar_despesas_produtos.html">Produtos</a></li>
                <li><a href="cadastrar_despesas_variados.html">Variados</a></li>
            </ul>
        </nav>
    </div>

    <main class="main">
        <!-- Modal de Sair -->
        <div class="modal-overlay hidden" id="modal-sair">
            <div class="modal-box">
                <button class="modal-close close-modal close-modal-sair" type="button">
                    <i class="fa-solid fa-xmark"></i>
                </button>

                <div class="modal-subject">
                    <div class="modal-header">
                        <p class="modal-title">Deseja mesmo <span>sair</span> da conta?</p>
                    </div>

                    <div class="modal-form">
                        <form>
                            <div class="sim-btn">
                                <button type="button" id="btn-sim">Sim</button>
                            </div>
                            <div class="nao-btn">
                                <button type="button" id="btn-nao">Não</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-receitas">
            <div class="form-title">
                <h2>Cadastrar Despesas</h2>
                <a href="/html/despesa_produto.html"><button type="button" class="ver-despesas">Ver Despesas</button></a>
            </div>

            <form>
                <div class="input-group">

                    <div class="input-box">
                        <label for="data-compra">Data da Compra</label>
                        <input type="date" id="data-compra" name="data-compra">
                    </div>

                    <div class="input-box">
                        <label for="validade">Validade</label>
                        <input type="date" id="validade" name="validade">
                    </div>

                    <div class="input-box">
                        <label for="nome-produto">Nome do Produto</label>
                        <input type="text" id="nome-produto" name="nome-produto">
                    </div>

                    <div class="input-box">
                        <label for="valor-unitario">Valor Unitário</label>
                        <input type="number" id="valor-unitario" name="valor-unitario" step="0.01">
                    </div>

                    <div class="input-box">
                        <label for="quantidade">Quantidade</label>
                        <input type="number" id="quantidade" name="quantidade">
                    </div>

                    <div class="input-box">
                        <label for="fornecedor">Fornecedor</label>
                        <select id="fornecedor" name="fornecedor">
                            <option value="">Selecione</option>
                            <option value="Kibon">Kibon</option>
                            <option value="Nestlé">Nestlé</option>
                            <option value="Mareni">Mareni</option>
                        </select>
                    </div>

                    <div class="input-box">
                        <label for="total">TOTAL</label>
                        <input type="text" id="total" name="total">
                    </div>

                </div>

                <div class="criar-btn">
                    <button type="submit" class="btn-cadastrar">Cadastrar</button>
                    <button type="button" class="btn-excluir">Excluir</button>
                </div>
            </form>
        </div>
    </main>
</div>

</body>
</html>
