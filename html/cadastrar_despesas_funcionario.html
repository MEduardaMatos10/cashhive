<head>
  <meta charset="UTF-8">
  <title>CashHive System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/cadastrar_despesas_funcionario.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../css/modalsair.css">
  
</head>
<body>

    <header class="container-header">
        <div class="logo">
            <img src="/img/logo.png" alt="Logo CashHive">
        </div>
        <div class="user">
            <p>Usuário Fulano de Tal (00.623.904/0001-73)</p>
        </div>
    </header>

    <div class="main-container">
        <aside class="menu">
            <nav class="nav">
                <ul>
                    <li>
                        <img src="/img/homeicon.svg" alt="Início">
                        <a href="homepage.html">Página inicial</a>
                    </li>
                    <li>
                        <img src="/img/profileicon.svg" alt="Perfil">
                        <a href="profle.html">Perfil</a>
                    </li>
                    <li>
                        <details class="submenu">
                            <summary>
                                <img src="/img/financeicon.svg" alt="Financeiro">
                                Financeiro
                            </summary>
                            <ul>
                                <li><a href="#">Receitas</a></li>
                                <li><a href="cadastrar_receitas.html">Cadastro de Receitas</a></li>
                                <li><a href="#">Despesas</a></li>
                                <li><a href="cadastrar_despesas.html">Cadastro de Despesas</a></li>
                            </ul>
                        </details>
                    </li>
                    <li class="logout">
                        <img src="/img/logouticon.svg" alt="Sair">
                        <button class="open-modal" data-modal="modal-sair">Sair</button>
                    </li>
                </ul>
            </nav>
        </aside>
        <div class="nav-category">
            <nav class="nav-options">
                <ul>
                    <li class="active"><a href="cadastrar_despesas_funcionario.html">Funcionário</a></li>
                    <li><a href="cadastrar_despesas_produtos.html">Produtos</a></li>
                    <li><a href="cadastrar_despesas_variados.html">Variados</a></li>
                </ul>
            </nav>
        </div>
<main class="main">
    <!-- Modal de Sair -->
        <div class="modal-overlay hidden" id="modal-sair">
            <div class="modal-box">
                <button class="modal-close close-modal close-modal-sair" type="button">
                    <i class="fa-solid fa-xmark"></i>
                </button>

                <div class="modal-subject">
                    <div class="modal-header">
                        <p class="modal-title">Deseja mesmo <span>sair</span> da conta?</p>
                    </div>

                    <div class="modal-form">
                    <form>
                        <div class="sim-btn">
                        <button type="button" id="btn-sim">Sim</button>
                        </div>
                        <div class="nao-btn">
                        <button type="button" id="btn-nao">Não</button>
                        </div>
                    </form>
                    </div>
                </div>
            </div>
        </div>

  <div class="input-receitas">
    <div class="form-title">
        <h2>Cadastrar Despesas</h2>
         <a href="despesas.html"><button type="button" class="ver-despesas">Ver Despesas</button></a>
    </div>
    <form>
        <div class="input-group">
        <div class="input-box">
            <label for="data-pagamento">Data pagamento</label>
            <input type="date" name="data-pagamento" id="data-pagamento">
        </div>

        <div class="input-box">
            <label for="salario">Salário</label>
            <input type="text" id="salario">
        </div>

        <div class="input-box">
            <label for="nome">Nome</label>
            <input type="text" id="nome">
        </div>

        <div class="input-box">
            <label for="total">TOTAL</label>
            <input type="text" id="total">
        </div>

        <div class="input-box">
            <label for="funcao">Função</label>
            <select id="funcao">
            <option value="">Selecione</option>
            <option value="gerente">Gerente</option>
            <option value="auxiliar">Auxiliar</option>
            </select>
        </div>

        <div class="input-box">
            <label for="idade">Idade</label>
            <input type="number" id="idade">
        </div>
        </div>

        <div class="criar-btn">
        <button type="submit" class="btn-cadastrar">Cadastrar</button>
        <button type="button" class="btn-excluir">Excluir</button>
        </div>
    </form>
   </div>
</main>
  

</body>
</html>
