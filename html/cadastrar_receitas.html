<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>CashHive System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/cadastrar_receitas.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../css/modalsair.css">
  <link rel="stylesheet" href="../css/modalcadastro.css">
</head>
<body>

    <header class="container-header">
        <div class="logo">
            <img src="/img/logo.png" alt="Logo CashHive">
        </div>
        <div class="user">
            <p>Usuário Fulano de Tal (00.623.904/0001-73)</p>
        </div>
    </header>

    <div class="main-container">
        <aside class="menu">
            <nav class="nav">
                <ul>
                    <li>
                        <img src="/img/homeicon.svg" alt="Início">
                        <a href="homepage.html">Página inicial</a>
                    </li>
                    <li>
                        <img src="/img/profileicon.svg" alt="Perfil">
                        <a href="profle.html">Perfil</a>
                    </li>
                    <li>
                        <details class="submenu">
                            <summary>
                                <img src="/img/financeicon.svg" alt="Financeiro">
                                Financeiro
                            </summary>
                            <ul>
                                <li><a href="#">Receitas</a></li>
                                <li><a href="#">Cadastro de Receitas</a></li>
                                <li><a href="#">Despesas</a></li>
                                <li><a href="#">Cadastro de Despesas</a></li>
                            </ul>
                        </details>
                    </li>
                    <li class="logout">
                        <img src="/img/logouticon.svg" alt="Sair">
                        <button class="open-modal" data-modal="modal-sair">Sair</button>
                    </li>
                </ul>
            </nav>
        </aside>
        

  <!-- Modal de Sair -->
  <div class="modal-overlay hidden" id="modal-sair">
    <div class="modal-box">
        <button class="modal-close close-modal close-modal-sair" type="button">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="modal-subject">
            <div class="modal-header">
                <p class="modal-title">Deseja mesmo <span>sair</span> da conta?</p>
            </div>

            <div class="modal-form">
              <form>
                <div class="sim-btn">
                  <button type="button" id="btn-sim">Sim</button>
                </div>
                <div class="nao-btn">
                  <button type="button" id="btn-nao">Não</button>
                </div>
              </form>
            </div>
        </div>
    </div>
</div>

<main class="input-receitas">
    <form>
      <div class="form-container">
        <h2>Cadastrar Receitas</h2>
  
        <div class="form-group">
          <label for="data-venda">Data da venda</label>
          <input type="date" id="data-venda" required>
  
          <label for="nome-cliente">Nome do Cliente</label>
          <input type="text" id="nome-cliente" required>
  
          <label for="nome-produto">Nome do Produto</label>
          <input type="text" id="nome-produto" required>
  
          <label for="valor-unitario">Valor Unitário</label>
          <input type="number" id="valor-unitario" step="0.01" required>
  
          <label for="categoria">Categoria</label>
          <select id="categoria" required>
            <option value="">Selecione</option>
            <option value="alimentos">Alimentos</option>
            <option value="bebidas">Bebidas</option>
            <option value="outros">Outros</option>
          </select>
  
          <label for="pagamento">Forma de Pagamento</label>
          <select id="pagamento" required>
            <option value="">Selecione</option>
            <option value="dinheiro">Dinheiro</option>
            <option value="cartao">Cartão</option>
            <option value="pix">PIX</option>
          </select>
  
          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" required>
  
          <label for="total">TOTAL</label>
          <input type="number" id="total" step="0.01" readonly>
        </div>
  
        <div class="button-receitas">
          <button type="submit" class="btn-cadastrar">Cadastrar</button>
          <button type="button" class="btn-excluir">Excluir</button>
        </div>
      </div>
    </form>
  </main>

<!-- JavaScript -->
<script>
  // Abre o modal ao clicar no botão com data-modal
  document.querySelectorAll(".open-modal").forEach(button => {
    button.addEventListener("click", () => {
      const modalId = button.getAttribute("data-modal");
      const modal = document.getElementById(modalId);
      if (modal) modal.classList.remove("hidden");
    });
  });

  // Fecha o modal ao clicar no botão com classe modal-close
  document.querySelectorAll(".modal-close").forEach(button => {
    button.addEventListener("click", () => {
      const modal = button.closest(".modal-overlay");
      if (modal) modal.classList.add("hidden");
    });
  });

  // Fecha o modal ao clicar fora da caixa (na overlay)
  document.querySelectorAll(".modal-overlay").forEach(overlay => {
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) {
        overlay.classList.add("hidden");
      }
    });
  });
</script>

</body>
</html>
