<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <title>CashHive System</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/modal_editar_usuario.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="../css/modalsair.css">
  <link rel="stylesheet" href="../css/modalcadastro.css">
  <link rel="stylesheet" href="../css/modaldesativar.css">
</head>

<body>
    <div class="modal-overlay hidden" id="modal-cadastro">
      <div class="modal-box">
        <button class="modal-close close-modal close-modal-cadastro" type="button">
          <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="modal-subject">
          <div class="modal-header">
            <p class="modal-title">Cadastre um novo usuário</p>
          </div>

          <div class="modal-form-new-user">
            <form action="#">
              <div class="input-group">
                <div class="input-box">
                  <label for="nome">Nome</label>
                  <input type="text" id="nome" name="nome" placeholder="Digite o nome do novo usuário" required>
                </div>

                <div class="input-box">
                  <label for="sobrenome">Sobrenome</label>
                  <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite o sobrenome do novo usuário"
                    required>
                </div>

                <div class="input-box">
                  <label for="cpf">CPF</label>
                  <input type="text" id="cpf" name="cpf" placeholder="Digite o CPF do novo usuário" required>
                </div>

                <div class="input-box">
                  <label for="email">E-mail</label>
                  <input type="email" id="email" name="email" placeholder="Digite o e-mail do novo usuário" required>
                </div>

                <div class="input-box">
                  <label for="cargo">Cargo</label>
                  <select id="cargo" name="cargo" required>
                    <option value="">Selecione o cargo</option>
                    <option value="admin">Administrador</option>
                    <option value="gerente">Gerente</option>
                    <option value="analista">Analista</option>
                  </select>
                </div>

                <div class="input-box">
                  <label for="nivel">Nível de permissão</label>
                  <select id="nivel" name="nivel" required>
                    <option value="">Selecione o nível de permissão</option>
                    <option value="1">Nível 1</option>
                    <option value="2">Nível 2</option>
                    <option value="3">Nível 3</option>
                  </select>
                </div>

                <div class="input-box">
                  <label for="senha">Senha</label>
                  <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
                </div>

                <div class="input-box">
                  <label for="repetir_senha">Repetir senha</label>
                  <input type="password" id="repetir_senha" name="repetir_senha" placeholder="Repita a senha criada"
                    required>
                </div>
              </div>

              <div class="criar-btn">
                <button type="submit">Criar Conta</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
</body>
</html>
