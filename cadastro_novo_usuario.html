<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Novo Usuário</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/reset.css">

    <!-- LINKS DO "X" PRA FECHAR O MODAL E DA FOLHA DE ESTILO DO MODAL -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="/css/cadastro_novo_usuario.css">
</head>
<body>

    <!-- ADICIONAR ESSE MODAL NO HTML DO PERFIL AO CLICAR EM ADD NOVO USUÁRIO -->
    <!-- COLOCAR O BUTTON DE ADICIONAR NOVO USUÁRIO COM A MESMA CLASSE QUE TA AQUI:
            A CLASSE TEM QUE TER class="open-modal" data-modal="modal-1"
    -->

    <!-- NO HTML DO PERFIL ONDE CLICA PRA ADD NOVO USUÁRIO TEM QUE TER UM BUTTON ASSIM:

    <button class="btn-add-user open-modal" data-modal="modal-1">Adicionar novo usuário</button>

    O BTN-ADD-USER VC VAI USAR PRA ESTILIZAR O BOTÃO QUE ABRE O MODAL. O OPEN-MODAL É NESSE JS.
     
    -->

    <!-- PRIMEIRO VEM O HTML NORMAL COM O BOTÃO PRO MODAL INCLUSO // DEPOIS O HTML DO MODAL E POR ÚLTIMO O JS COM A TAG SCRIPT -->


    <!-- HTML PARA BOTÃO DE ADICIONAR NOVO USUÁRIO -->

    <button class="btn-add-user open-modal" data-modal="modal-1">Adicionar novo usuário</button>


    <!-- Modal Cadastro Novo Usuário -->

    <!-- Modal -->
    <div class="modal-overlay hidden" id="modal-1">

        <div class="modal-box">

            <button class="modal-close close-modal" type="button">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="modal-subject">
                <div class="modal-header">
                    <p class="modal-title">Cadastre um novo usuário</p>
                </div>

                <div class="modal-form-new-user">
                    <form action="#">
                        <div class="input-group">

                            <div class="input-box">
                                <label for="nome">Nome</label>
                                <input type="text" id="nome" name="nome" placeholder="Digite o nome do novo usuário" required>
                            </div>

                            <div class="input-box">
                                <label for="sobrenome">Sobrenome</label>
                                <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite o sobrenome do novo usuário" required>
                            </div>

                            <div class="input-box">
                                <label for="cpf">CPF</label>
                                <input type="text" id="cpf" name="cpf" placeholder="Digite o CPF do novo usuário" required>
                            </div>

                            <div class="input-box">
                                <label for="email">E-mail</label>
                                <input type="email" id="email" name="email" placeholder="Digite o e-mail do novo usuário" required>
                            </div>

                            <div class="input-box">
                                <label for="cargo">Cargo</label>
                                <select id="cargo" name="cargo" required>
                                    <option value="">Selecione o cargo</option>
                                    <option value="admin">Administrador</option>
                                    <option value="gerente">Gerente</option>
                                    <option value="analista">Analista</option>
                                </select>
                            </div>

                            <div class="input-box">
                                <label for="nivel">Nível de permissão</label>
                                <select id="nivel" name="nivel" required>
                                    <option value="">Selecione o nível de permissão</option>
                                    <option value="1">Nível 1</option>
                                    <option value="2">Nível 2</option>
                                    <option value="2">Nível 3</option>
                                </select>
                            </div>

                            <div class="input-box">
                                <label for="senha">Senha</label>
                                <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
                            </div>

                            <div class="input-box">
                                <label for="repetir_senha">Repetir senha</label>
                                <input type="password" id="repetir_senha" name="repetir_senha" placeholder="Repita a senha criada" required>
                            </div>

                        </div>
                    
                        <div class="criar-btn">
                            <button type="submit">Criar Conta</button>
                        </div>

                    </form>

                </div>

            </div>
            
        </div>
        
    </div>


    <script>
        // Script para abrir Modal de adicionar novo usuário ao clicar no button de "adicionar novo usuário".
        
        const openModalBtn = document.querySelector(".open-modal");
        const modal = document.getElementById("modal-1");
        const closeModalBtn = modal.querySelector(".close-modal");

        openModalBtn.addEventListener("click", () => {
        modal.classList.remove("hidden");
        });

        closeModalBtn.addEventListener("click", () => {
        modal.classList.add("hidden");
        });

        window.addEventListener("click", (e) => {
        if (e.target === modal) {
            modal.classList.add("hidden");
        }
        });
    </script>
    

</body>
</html>
